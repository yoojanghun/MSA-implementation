server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mariadb://localhost:3306/user_db
    username: root
    password: password
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  graphql:
    graphiql:
      enabled: true

app:
  rabbitmq:
    exchange: user.exchange
    routing-key: user.created.v1
