services:
  # MariaDB (ACID 트랜잭션 및 Outbox 패턴 지원)
  mariadb:
    image: mariadb:11.4
    container_name: msa-mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: user_db
    ports:
      - "3307:3306"     
    volumes:
      - mariadb_data:/var/lib/mysql

  # RabbitMQ (비동기 메시지 브로커)
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: msa-rabbitmq
    restart: always
    ports:
      - "5672:5672"     # AMQP 프로토콜 포트
      - "15672:15672"   # Management Web UI (ID: guest / PW: guest)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  mariadb_data:
  rabbitmq_data:
